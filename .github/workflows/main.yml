name: Python Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Instalar pytest
        run: pip install pytest

      - name: Ejecutar tests
        run: pytest -v test.py
